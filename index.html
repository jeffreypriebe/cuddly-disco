<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JPL Fan Club</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #2b1055, #0f0c29);
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    color: #fff;
    text-align: center;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 2px solid gold;
    border-radius: 16px;
    padding: 3rem 2.5rem;
    max-width: 480px;
    box-shadow: 0 0 40px rgba(255,215,0,0.25);
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 0.25rem;
    color: gold;
    text-shadow: 0 0 12px rgba(255,215,0,0.6);
  }
  .subtitle {
    font-size: 1.1rem;
    margin-bottom: 1.5rem;
    letter-spacing: 0.5px;
  }
  .badge {
    display: inline-block;
    margin: 1rem 0;
    padding: 0.5rem 1.25rem;
    border: 1px dashed gold;
    border-radius: 999px;
    font-size: 0.85rem;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .members {
    margin-top: 2rem;
    font-size: 0.95rem;
    opacity: 0.85;
  }
  .members span {
    display: block;
    font-size: 1.8rem;
    font-weight: bold;
    color: gold;
  }
  footer {
    margin-top: 2rem;
    font-size: 0.75rem;
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Fan Club Confirmed.</h1>
    <div class="subtitle">Established August 28, 2026</div>
    <div class="members">
      Current Membership
      <span>2</span>
      (and growing, probably)
    </div>
    <footer>All rights reserved. No refunds.</footer>
  </div>
</body>
</html>
